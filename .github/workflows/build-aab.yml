name: Build AAB TogoSheets
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Config Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Restaurer la cle
        run: echo "${{ secrets.KEYSTORE_B64 }}" | tr -d '\n' | base64 -d > android.keystore
      - name: Numero de version
        run: |
          jq --argjson c ${{ github.run_number }} '.appVersionCode=$c | .appVersionName=("1.0."+($c|tostring))' twa-manifest.json > t.json && mv t.json twa-manifest.json
      - name: Generer et compiler
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          npm install -g @bubblewrap/cli
          bubblewrap update --skipVersionUpgrade
          bubblewrap build --skipPwaValidation
      - uses: actions/upload-artifact@v4
        with:
          name: togosheets-aab
          path: |
            app-release-bundle.aab
            app-release-signed.apk
      - name: Effacer la cle
        if: always()
        run: rm -f android.keystore
